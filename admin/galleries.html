<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Studio — Galleries</title>
<link rel="icon" href="../images/favicon-1791284648615.png">
<style>
:root{--bg:#0e0d0c;--p:#171513;--p2:#1f1c19;--p3:#27231f;--line:#302a25;--fg:#efe9df;--muted:#9d9387;--gold:#c9a46a;--red:#ff8f80;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button,select{background:var(--p3);border:1px solid var(--line);border-radius:9px;padding:9px 14px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover,select:hover{border-color:var(--gold)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.primary{background:var(--gold);color:#17120b;border-color:var(--gold);font-weight:600}
.primary:hover{background:#d6b57d;border-color:#d6b57d}
.ghost{background:none}.danger{color:var(--red)}
input,textarea{background:#100e0d;border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--gold);outline:0}
textarea{resize:vertical}
.muted{color:var(--muted)}.sp{flex:1}

/* top bar */
.top{height:60px;flex:none;display:flex;align-items:center;gap:18px;padding:0 24px;background:var(--p);border-bottom:1px solid var(--line)}
.brand{font:24px var(--serif)}
.nav{display:flex;gap:4px}
.navb{background:none;border:0;border-radius:8px;color:var(--muted);padding:8px 14px}
.navb:hover{color:var(--fg)}
.navb.on{color:var(--gold);background:var(--p3)}
.chip{display:flex;align-items:center;gap:9px;background:none;padding:6px 12px;font-size:12px;color:var(--muted)}
.chip i{display:block;width:70px;height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.chip i b{display:block;height:100%;background:var(--gold)}
.status{color:var(--muted);font-size:12px}
.toplink{color:var(--muted);text-decoration:none;font-size:13px}

#view{flex:1;min-height:0;overflow:auto}
.page{max-width:1480px;margin:0 auto;padding:34px 28px 130px}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1.big{font:400 42px/1.1 var(--serif);margin:0 0 6px}
.pagehead p{margin:0}
.search{width:240px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:none;color:var(--muted);padding:8px 13px}
.seg button.on{background:var(--p3);color:var(--gold)}

/* client cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:30px 26px;align-items:start}
.card{position:relative;display:block;color:inherit;text-decoration:none;border-radius:14px}
.cardimg{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--p2);border:1px solid var(--line);transition:border-color .2s}
.cardimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .cardimg{border-color:var(--gold)}
.card:hover .cardimg img{transform:scale(1.03)}
.noimg{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px}
.cardinfo{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 4px 0}
.cardinfo h3{font:400 22px/1.2 var(--serif);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardinfo span{color:var(--muted);font-size:13px;white-space:nowrap}
.tags{position:absolute;top:12px;left:12px;display:flex;gap:6px}
.tag{background:#000a;backdrop-filter:blur(6px);border-radius:20px;padding:2px 10px;font-size:11.5px}
.newcard{aspect-ratio:4/3;width:100%;border:1px dashed #4a3f33;border-radius:14px;background:none;color:var(--gold);font-size:16px}
.newcard:hover{background:var(--p)}

/* client hero */
.hero{position:relative;height:46vh;min-height:330px;max-height:540px;background:var(--p2);overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.herofade{position:absolute;inset:0;background:linear-gradient(to top,#0e0d0cf2 0%,#0e0d0c66 48%,#0e0d0c80 100%)}
.herotop{position:absolute;top:18px;left:28px;right:28px;display:flex;gap:8px}
.glass{background:#0e0d0c99;backdrop-filter:blur(8px);border-color:#ffffff24}
.herobody{position:absolute;left:28px;right:28px;bottom:26px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.herotitle{flex:1;min-width:260px}
.titlein{font:400 clamp(30px,5vw,56px)/1.1 var(--serif);background:none;border:0;border-bottom:1px dashed transparent;border-radius:0;padding:0 0 4px}
.titlein:hover{border-color:#ffffff40}.titlein:focus{border-color:var(--gold)}
.herometa{display:flex;gap:16px;align-items:center;color:var(--muted)}
.datein{background:none;border:0;border-bottom:1px dashed transparent;border-radius:0;padding:2px 0;width:200px}
.datein:hover{border-color:#ffffff40}.datein:focus{border-color:var(--gold)}
.herohint{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.wrap{max-width:1480px;margin:0 auto;padding:24px 28px 130px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer}
.opt input{width:auto;accent-color:var(--gold)}

/* thumbnails */
.grid.square{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.grid.square .th{aspect-ratio:1}
.grid.square .th img{width:100%;height:100%;object-fit:cover}
.grid.natural{columns:210px;column-gap:10px}
.grid.natural .th{break-inside:avoid;margin-bottom:10px}
.grid.natural .th img{width:100%;height:auto}
.th{position:relative;border-radius:8px;overflow:hidden;background:var(--p2);cursor:pointer;user-select:none;border:2px solid transparent}
.th img{display:block;pointer-events:none}
.th.sel{border-color:var(--gold)}
.th.dragging{opacity:.3}
.th.before{box-shadow:-5px 0 0 var(--gold)}.th.after{box-shadow:5px 0 0 var(--gold)}
.chk{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;padding:0;background:#0009;border:2px solid #fff;opacity:0;display:grid;place-items:center}
.th:hover .chk,.th.sel .chk{opacity:1}
.th.sel .chk{background:var(--gold);border-color:var(--gold)}
.th.sel .chk::after{content:'✓';color:#17120b;font-weight:700;font-size:14px;line-height:1}
@media(hover:none){.chk{opacity:1}}
.badge{position:absolute;top:8px;right:8px;background:var(--gold);color:#17120b;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}
.n{position:absolute;bottom:8px;left:8px;background:#000b;border-radius:6px;padding:1px 7px;font-size:11px}
.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.empty h2{font:400 26px var(--serif);color:var(--fg);margin:0 0 8px}

/* selection bar, toast, progress */
.selbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--p3);border:1px solid var(--gold);border-radius:14px;padding:10px 12px 10px 18px;display:none;align-items:center;gap:10px;z-index:8;box-shadow:0 12px 40px #000a}
.selbar.on{display:flex}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--p3);border:1px solid var(--gold);border-radius:10px;padding:10px 16px;display:none;z-index:40;max-width:90vw}
.dropov{position:fixed;inset:0;background:#0e0d0ce8;display:none;place-items:center;z-index:30;font:30px var(--serif);border:3px dashed var(--gold);margin:14px;border-radius:20px;inset:0;pointer-events:none}
.dropov.on{display:grid}
.prog{position:fixed;inset:0;background:#0e0d0ccc;display:none;place-items:center;z-index:35}
.prog.on{display:grid}
.progbox{width:min(420px,90vw);background:var(--p);border:1px solid var(--line);border-radius:14px;padding:22px}
.progbox h2{font:400 22px var(--serif);margin:0 0 14px}
.pbar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.pbar b{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}

/* photo viewer */
.modal{position:fixed;inset:0;background:#0b0a09;display:none;z-index:20;grid-template-columns:minmax(0,1fr) 340px}
.modal.on{display:grid}
.mstage{position:relative;display:grid;place-items:center;padding:30px;min-height:0}
.mstage img{max-width:100%;max-height:calc(100dvh - 60px);object-fit:contain}
.mnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;padding:0;font-size:22px;background:#0009}
.mnav.l{left:16px}.mnav.r{right:16px}
.mside{background:var(--p);border-left:1px solid var(--line);overflow:auto;padding:20px}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.dh h2{font:400 22px var(--serif);margin:0}
.x{padding:6px 11px}
.focusbox{position:relative;width:100%;aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#100e0d;cursor:crosshair;touch-action:none}
.focusbox img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.focusdot{position:absolute;width:20px;height:20px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #0008;transform:translate(-50%,-50%);pointer-events:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.field{margin:14px 0}
.field label{display:block;color:#d2c8bc;font-size:12.5px;margin-bottom:6px}
small{display:block;color:var(--muted);font-size:12px;margin-top:5px;line-height:1.45}
.check{display:flex;gap:10px;align-items:flex-start;margin:13px 0;color:#d7cec2;cursor:pointer}
.check input{width:auto;margin-top:3px;accent-color:var(--gold)}
.row{display:flex;gap:7px}.row button{flex:none}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}

/* settings drawer + dialog */
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100vw;background:var(--p);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s;z-index:15;overflow:auto;padding:22px;box-shadow:-14px 0 40px #0008}
.drawer.on{transform:none}
.drawer h3{font:400 18px var(--serif);margin:26px 0 4px;color:var(--gold)}
.dlg{position:fixed;inset:0;background:#0e0d0ccc;display:none;place-items:center;z-index:25}
.dlg.on{display:grid}
.dbox{width:min(440px,92vw);background:var(--p);border:1px solid var(--line);border-radius:15px;padding:24px}
.dbox h2{font:400 26px var(--serif);margin:0 0 6px}
.dbox .actions{justify-content:flex-end;margin-bottom:0}

/* storage */
.meter{display:flex;height:16px;border-radius:10px;overflow:hidden;background:var(--p2);border:1px solid var(--line);margin:16px 0 14px}
.meter b{display:block;height:100%}
.legend{display:flex;gap:20px;flex-wrap:wrap}
.legend div{display:flex;align-items:center;gap:8px;color:#d7cec2}
.legend i{width:11px;height:11px;border-radius:3px;display:block}
.legend span{color:var(--muted)}
.big2{font:400 34px var(--serif)}
.panel{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:22px}
.srow{display:grid;grid-template-columns:56px minmax(0,1fr) 120px 90px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.srow:first-of-type{border-top:0}
.srow:hover .sname{color:var(--gold)}
.sth{width:56px;height:42px;border-radius:6px;overflow:hidden;background:var(--p2)}
.sth img{width:100%;height:100%;object-fit:cover;display:block}
.sname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.sbar b{display:block;height:100%;background:var(--gold)}
.sz{text-align:right;color:var(--muted)}

.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50}
.login[hidden]{display:none}
.loginbox{width:min(420px,92vw);background:var(--p);border:1px solid var(--line);border-radius:15px;padding:26px}
.loginbox h1{font:400 30px var(--serif);margin:0 0 6px}
.loginbox p{color:var(--muted);font-size:13px}
.loginbox input{margin:10px 0}

@media(max-width:900px){
  .modal{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .mside{border-left:0;border-top:1px solid var(--line);max-height:46dvh}
  .chip i{display:none}
}
@media(max-width:700px){
  .top{padding:0 12px;gap:8px}.brand{font-size:20px}.status,.toplink{display:none}
  .page{padding:22px 14px 130px}.wrap{padding:18px 14px 130px}
  h1.big{font-size:32px}
  .cards{grid-template-columns:1fr;gap:24px}
  .herotop,.herobody{left:14px;right:14px}
  .grid.square{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .grid.natural{columns:2}
  .search{width:100%}
  .srow{grid-template-columns:48px minmax(0,1fr) 70px}.srow .sbar{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<header class="top">
  <div class="brand">Studio</div>
  <nav class="nav">
    <button class="navb" data-go="clients">Clients</button>
    <button class="navb" data-go="portfolio">Portfolio</button>
    <button class="navb" data-go="storage">Storage</button>
  </nav>
  <button class="chip" id="chip" data-go="storage" hidden></button>
  <div class="sp"></div>
  <span class="status" id="status">Connect to your Studio</span>
  <a class="toplink" href="index.html">Back to Studio</a>
  <button id="save" class="primary" disabled>Publish</button>
</header>

<div id="view"></div>

<div class="selbar" id="selbar"></div>
<aside class="drawer" id="drawer" aria-label="Gallery settings"></aside>
<div class="modal" id="modal"></div>
<div class="dlg" id="dlg"></div>
<div class="prog" id="prog"><div class="progbox"><h2 id="progtitle">Uploading…</h2><div class="pbar"><b id="progbar"></b></div><small id="progsub"></small></div></div>
<div class="dropov" id="dropov">Drop photos to upload</div>
<div class="toast" id="toast" role="status"></div>

<div class="login" id="login"><div class="loginbox"><h1>Studio galleries</h1><p>Use the same GitHub token as Studio. It stays in this browser, under the same key as the Studio editor.</p><input id="token" type="password" placeholder="GitHub token" autocomplete="off"><button class="primary" id="connect" style="width:100%">Connect</button><p id="err" style="color:var(--red)"></p></div></div>
<input type="file" id="files" accept="image/*" multiple hidden>

<script>
const REPO='jashwanthpm/jp-portfolio',BR='main',API='https://api.github.com/repos/'+REPO,LIMIT=1024**3;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hdr=()=>({Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'});
const imgUrl=p=>p?(/^https?:\/\//.test(p)?p:p.startsWith('/')?p:'/'+p):'';
const norm=p=>{p=String(p||'').replace(/^\/+/,'');try{return decodeURIComponent(p)}catch(e){return p}};
const fmt=b=>b>=1024**3?(b/1024**3).toFixed(2)+' GB':b>=1024**2?(b/1024**2).toFixed(1)+' MB':Math.round(b/1024)+' KB';
const gv=(o,k)=>k.split('.').reduce((a,b)=>a?.[b],o);
function setf(o,k,v){const ks=k.split('.');const last=ks.pop();ks.forEach(x=>o=o[x]=o[x]||{});o[last]=v}

let token=localStorage.getItem('jp_tok')||'',D=null,sha='',dirty=false;
let view='clients',cur=-1,q='',filter='all',fit=localStorage.getItem('gm_fit')||'square';
let picked=new Set(),photoIdx=-1,drawerOpen=false,dragFrom=-1,uploadKind='client';
let tree=null,sizeMap={},repoKB=null,storLoading=false,storErr='';

const toast=s=>{const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)};
function mark(){dirty=true;$('#save').disabled=false;$('#status').textContent='Changes not published'}
const focusOf=p=>(D.focus||{})[p]||'50% 50%';
const optim=()=>localStorage.getItem('gm_opt')!=='0';

/* ---------- portfolio data (auto-detected list of pictures in content.json) ---------- */
const CAND=['portfolio','works','work','gallery','photos','images','slides'];
const IMGRE=/\.(jpe?g|png|webp|gif|avif)/i;
const KEYS=['src','image','img','url','photo','path'];
const srcOf=it=>typeof it==='string'?it:(it&&KEYS.map(k=>it[k]).find(Boolean))||'';
const arrays=()=>Object.keys(D).filter(k=>k!=='clients'&&Array.isArray(D[k])&&D[k].some(x=>IMGRE.test(srcOf(x))));
function pKey(){const k=localStorage.getItem('gm_pkey'),a=arrays();if(k&&Array.isArray(D[k]))return k;return a.find(x=>CAND.includes(x))||a[0]||'portfolio'}
function pArr(){const k=pKey();if(!Array.isArray(D[k]))D[k]=[];return D[k]}
function ctx(){
  if(view==='client'){const c=D.clients[cur];return{kind:'client',c,arr:c.photos,list:c.photos}}
  const arr=pArr();return{kind:'portfolio',arr,list:arr.map(srcOf)}
}

/* ---------- routing ---------- */
function route(){
  const h=location.hash.slice(1)||'clients';
  if(h.startsWith('client/')){const slug=decodeURIComponent(h.slice(7));cur=D.clients.findIndex(c=>c.slug===slug);view=cur<0?'clients':'client'}
  else view=['clients','portfolio','storage'].includes(h)?h:'clients';
  picked.clear();photoIdx=-1;closeDrawer();renderModal();render();$('#view').scrollTop=0;
}
const go=h=>{if(location.hash==='#'+h)route();else location.hash=h};
addEventListener('hashchange',()=>D&&route());

/* ---------- views ---------- */
function render(){
  if(!D)return;
  const v=$('#view'),st=v.scrollTop;
  $$('.navb').forEach(b=>b.classList.toggle('on',b.dataset.go===(view==='client'?'clients':view)));
  v.innerHTML=view==='client'?viewClient():view==='portfolio'?viewPortfolio():view==='storage'?viewStorage():viewClients();
  v.scrollTop=st;selbar();chip();
}

function cardsHTML(){
  const ql=q.toLowerCase();
  const items=D.clients.map((c,i)=>({c,i})).filter(({c})=>((c.name||'')+' '+(c.slug||'')).toLowerCase().includes(ql))
    .filter(({c})=>filter==='all'||(filter==='public'&&!c.private)||(filter==='hidden'&&c.private)||(filter==='pin'&&c.pinHash));
  return '<button class="newcard" data-act="newclient">＋ New client gallery</button>'+items.map(({c})=>{
    const cv=c.cover||c.photos[0];
    return `<a class="card" href="#client/${encodeURIComponent(c.slug)}">
      <div class="cardimg">${cv?`<img loading="lazy" src="${esc(imgUrl(cv))}" style="object-position:${focusOf(cv)}" alt="">`:'<div class="noimg">No photos yet</div>'}</div>
      <div class="tags">${c.private?'<span class="tag">Hidden</span>':''}${c.pinHash?'<span class="tag">PIN</span>':''}</div>
      <div class="cardinfo"><h3>${esc(c.name||'Untitled gallery')}</h3><span>${c.photos.length} photos</span></div>
      ${c.date?`<div class="cardinfo" style="padding-top:0"><span>${esc(c.date)}</span></div>`:''}
    </a>`}).join('');
}
function viewClients(){
  const f=[['all','All'],['public','Public'],['hidden','Hidden'],['pin','PIN']];
  return `<div class="page"><div class="pagehead"><div><h1 class="big">Clients</h1><p class="muted">${D.clients.length} galleries. Open one to arrange photos and choose its cover.</p></div><div class="sp"></div>
    <input class="search" id="q" placeholder="Search clients…" value="${esc(q)}" aria-label="Search clients">
    <div class="seg">${f.map(([k,t])=>`<button data-act="filter" data-v="${k}" class="${filter===k?'on':''}">${t}</button>`).join('')}</div></div>
    <div class="cards" id="cards">${cardsHTML()}</div></div>`;
}

const barHTML=hint=>`<div class="bar"><span class="muted">${hint}</span><div class="sp"></div>
  <label class="opt"><input type="checkbox" id="optim" ${optim()?'checked':''}> Resize big photos on upload</label>
  <div class="seg"><button data-act="fit" data-v="square" class="${fit==='square'?'on':''}">Square</button><button data-act="fit" data-v="natural" class="${fit==='natural'?'on':''}">Full photo</button></div></div>`;

function gridHTML(cx){
  if(!cx.list.length)return `<div class="empty"><h2>No photos yet</h2><p>Drag photos anywhere on this page, or use the upload button.</p><button class="primary" data-act="upload">Upload photos</button></div>`;
  return `<div class="grid ${fit}">`+cx.list.map((p,k)=>`<div class="th ${picked.has(k)?'sel':''}" draggable="true" data-k="${k}">
    <img loading="lazy" src="${esc(imgUrl(p))}" ${cx.kind==='client'?`style="object-position:${focusOf(p)}"`:''} draggable="false" alt="Photo ${k+1}">
    <button class="chk" data-act="pick" data-k="${k}" aria-label="Select photo ${k+1}"></button>
    ${cx.kind==='client'&&p===cx.c.cover?'<span class="badge">Cover</span>':''}<span class="n">${k+1}</span></div>`).join('')+'</div>';
}

function viewClient(){

/* ---------- storage ---------- */
async function loadStorage(){
  if(storLoading)return;storLoading=true;storErr='';
  try{
    const [a,b]=await Promise.all([fetch(API,{headers:hdr()}),fetch(API+'/git/trees/'+BR+'?recursive=1',{headers:hdr()})]);
    if(a.ok)repoKB=(await a.json()).size;
    if(!b.ok)throw Error('Could not read file sizes ('+b.status+')');
    tree=(await b.json()).tree.filter(t=>t.type==='blob');sizeMap={};tree.forEach(t=>sizeMap[t.path]=t.size||0);
  }catch(e){storErr=e.message;tree=[]}
  storLoading=false;if(view==='storage')render();chip();
}
function viewStorage(){
  if(!tree){loadStorage();return '<div class="page"><h1 class="big">Storage</h1><p class="muted">Measuring your files…</p></div>'}
  const total=tree.reduce((a,t)=>a+(t.size||0),0),used=repoKB?repoKB*1024:total,seen=new Set();
  let port=0;pArr().map(srcOf).map(norm).filter(Boolean).forEach(p=>{if(!seen.has(p)){seen.add(p);port+=sizeMap[p]||0}});
  let cl=0;D.clients.forEach(c=>[...c.photos,c.cover].filter(Boolean).map(norm).forEach(p=>{if(!seen.has(p)){seen.add(p);cl+=sizeMap[p]||0}}));
  let oi=0;tree.forEach(t=>{if(/\.(jpe?g|png|webp|gif|avif|heic|svg)$/i.test(t.path)&&!seen.has(t.path))oi+=t.size||0});
  const other=Math.max(0,total-cl-port-oi),hist=Math.max(0,used-total);
  const segs=[['Client galleries',cl,'#c9a46a'],['Portfolio',port,'#e6d3ab'],['Other site images',oi,'#8a7a66'],['Code and other files',other,'#5b5148'],['Git history',hist,'#3a332d']];
  const pct=Math.min(100,used/LIMIT*100);
  const rows=D.clients.map(c=>{let s=0;new Set([...c.photos,c.cover].filter(Boolean).map(norm)).forEach(p=>s+=sizeMap[p]||0);return{c,s}}).sort((a,b)=>b.s-a.s),mx=Math.max(1,rows[0]?.s||1);
  return `<div class="page"><div class="pagehead"><div><h1 class="big">Storage</h1><p class="muted">Your photos live in your GitHub repository. GitHub recommends keeping a repository under about 1 GB.</p></div></div>
    ${storErr?`<p style="color:var(--red)">${esc(storErr)}</p>`:''}
    <div class="panel"><div class="big2">${fmt(used)} <span class="muted" style="font-size:18px">of 1 GB · ${pct.toFixed(1)}% used</span></div>
      <div class="meter" role="img" aria-label="${pct.toFixed(0)} percent of storage used">${segs.map(([n,v,col])=>`<b style="width:${v/LIMIT*100}%;background:${col}" title="${n}"></b>`).join('')}</div>
      <div class="legend">${segs.map(([n,v,col])=>`<div><i style="background:${col}"></i>${n} <span>${fmt(v)}</span></div>`).join('')}</div></div>
    <div class="panel"><h2 style="font:400 22px var(--serif);margin:0 0 8px">By client</h2>
      ${rows.map(({c,s})=>{const cv=c.cover||c.photos[0];return `<a class="srow" href="#client/${encodeURIComponent(c.slug)}"><div class="sth">${cv?`<img loading="lazy" src="${esc(imgUrl(cv))}" alt="">`:''}</div><div><div class="sname">${esc(c.name||'Untitled gallery')}</div><small style="margin:0">${c.photos.length} photos</small></div><div class="sbar"><b style="width:${s/mx*100}%"></b></div><div class="sz">${fmt(s)}</div></a>`}).join('')||'<p class="muted">No client galleries yet.</p>'}</div>
    <p class="muted" style="font-size:12px">Removing a photo from a gallery does not delete its file, so it still counts here. File sizes come from the main branch; the total also includes Git history.</p></div>`;
}
function chip(){
  const c=$('#chip');if(!D||(!repoKB&&!tree)){c.hidden=true;return}
  const used=repoKB?repoKB*1024:Object.values(sizeMap).reduce((a,b)=>a+b,0);
  c.hidden=false;c.innerHTML=`Storage <i><b style="width:${Math.min(100,used/LIMIT*100)}%"></b></i> ${fmt(used)}`;
}

/* ---------- upload (straight to the GitHub repo) ---------- */
const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
async function shrink(f){
  const ext=(f.name.split('.').pop()||'jpg').toLowerCase();
  if(!optim()||!/^image\/(jpeg|png|webp)$/.test(f.type))return{blob:f,ext};
  try{
    const bmp=await createImageBitmap(f),s=Math.min(1,2400/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');
    cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.88));
    if(blob&&(s<1||blob.size<f.size))return{blob,ext:'jpg'};
  }catch(e){}
  return{blob:f,ext};
}
async function put(path,content,msg){
  for(let t=0;t<3;t++){
    const r=await fetch(API+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',headers:hdr(),body:JSON.stringify({message:msg,content,branch:BR})});
    if(r.ok)return;
    if(r.status===409||r.status===422||r.status>=500){await new Promise(s=>setTimeout(s,900*(t+1)));continue}
    throw Error('GitHub upload failed ('+r.status+'). Check the token can write to the repository.');
  }
  throw Error('GitHub is busy. Try again in a moment.');
}
function folderFor(list,fallback){
  const f=list[0];if(f&&!/^https?:/.test(f)){const d=norm(f).split('/').slice(0,-1).join('/');if(d)return d}
  return fallback;
}
async function upload(files){
  files=[...files].filter(f=>f.type.startsWith('image/'));
  if(!files.length){toast('Choose image files to upload');return}
  const cx=ctx(),isC=cx.kind==='client';
  const folder=folderFor(cx.list,isC?'images/clients/'+cx.c.slug:'images/portfolio');
  const P=$('#prog');P.classList.add('on');let ok=0;const failed=[];
  for(let i=0;i<files.length;i++){
    $('#progtitle').textContent='Uploading '+(i+1)+' of '+files.length;$('#progsub').textContent=files[i].name;$('#progbar').style.width=(i/files.length*100)+'%';
    try{
      const {blob,ext}=await shrink(files[i]);
      const base=files[i].name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'photo';
      const path=folder+'/'+Date.now().toString(36)+i+'-'+base+'.'+ext;
      await put(path,await b64(blob),'Upload '+path);
      if(isC)cx.arr.push(path);
      else{const first=cx.arr[0];if(first&&typeof first==='object'){const key=KEYS.find(k=>first[k])||'src';cx.arr.push({[key]:path})}else cx.arr.push(path)}
      ok++;
    }catch(e){failed.push(files[i].name+': '+e.message)}
  }
  P.classList.remove('on');$('#files').value='';
  if(ok){mark();tree=null;if(isC&&!cx.c.cover)cx.c.cover=cx.arr[0];render()}
  toast(ok?ok+' uploaded. Publish to make '+(ok===1?'it':'them')+' live.'+(failed.length?' '+failed.length+' failed.':''):failed[0]||'Upload failed');
}
$('#files').onchange=e=>upload(e.target.files);
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files'),canUp=()=>['client','portfolio'].includes(view);
let dc=0;
addEventListener('dragenter',e=>{if(hasFiles(e)&&canUp()){dc++;$('#dropov').classList.add('on')}});
addEventListener('dragleave',e=>{if(hasFiles(e)){dc=Math.max(0,dc-1);if(!dc)$('#dropov').classList.remove('on')}});
addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
addEventListener('drop',e=>{if(hasFiles(e)){e.preventDefault();dc=0;$('#dropov').classList.remove('on');if(canUp()){uploadKind=view;upload(e.dataTransfer.files)}}});

/* ---------- load / publish ---------- */
async function load(){
  try{
    const r=await fetch(API+'/contents/content.json?ref='+BR+'&t='+Date.now(),{headers:hdr()});
    if(!r.ok)throw Error('Could not read content.json ('+r.status+'). Check token permissions.');
    const j=await r.json();sha=j.sha;
    D=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
    D.clients=D.clients||[];D.clients.forEach(c=>{c.photos=c.photos||[];c.lay=c.lay||{}});
    $('#login').hidden=true;$('#status').textContent='Connected · '+D.clients.length+' galleries';
    fetch(API,{headers:hdr()}).then(r=>r.ok?r.json():null).then(j=>{if(j){repoKB=j.size;chip()}}).catch(()=>{});
    route();
  }catch(e){$('#login').hidden=false;$('#err').textContent=e.message}
}
async function publish(){
  if(!dirty)return;$('#save').disabled=true;$('#status').textContent='Publishing…';
  try{
    const body={message:'Update galleries and portfolio',content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,2)))),sha,branch:BR};
    const r=await fetch(API+'/contents/content.json',{method:'PUT',headers:hdr(),body:JSON.stringify(body)});
    if(!r.ok)throw Error('GitHub publish failed ('+r.status+').');
    sha=(await r.json()).content.sha;dirty=false;$('#status').textContent='Published · the site may take a minute to update';toast('Published');
  }catch(e){$('#status').textContent='Publish failed';$('#save').disabled=false;toast(e.message)}
}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#dlg').classList.contains('on'))$('#dlg').classList.remove('on');
    else if(photoIdx>=0){photoIdx=-1;renderModal()}
    else if(drawerOpen)closeDrawer();
    else if(picked.size){picked.clear();render()}
  }
  if(photoIdx>=0&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    const n=ctx().list.length;
    if(e.key==='ArrowLeft'&&photoIdx>0){photoIdx--;renderModal()}
    if(e.key==='ArrowRight'&&photoIdx<n-1){photoIdx++;renderModal()}
  }
});
$('#connect').onclick=()=>{token=$('#token').value.trim();localStorage.setItem('jp_tok',token);load()};
$('#token').value=token;$('#save').onclick=publish;
load();
</script></body></html>
