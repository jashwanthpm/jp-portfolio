<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Studio — Site Editor</title>
<style>
:root{--bg:#0f0e0d;--p:#181614;--p2:#211e1b;--l:#2e2925;--fg:#efe9df;--m:#9b9185;--a:#c9a46a}
*{box-sizing:border-box;margin:0}body{font:14px/1.5 -apple-system,Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--l);background:var(--p)}.top b{font:600 17px Georgia,serif;margin-right:auto}#msg{color:var(--m);font-size:13px}#msg.e{color:#ff8a7a}
.main{flex:1;display:grid;grid-template-columns:minmax(340px,440px) 1fr;min-height:0}
#side{overflow:auto;padding:14px;border-right:1px solid var(--l);background:var(--p)}
.view{display:flex;flex-direction:column;min-width:0;background:#090807}.vbar{display:flex;gap:8px;padding:10px;justify-content:center;border-bottom:1px solid var(--l)}
.stage{flex:1;display:flex;justify-content:center;padding:14px;min-height:0}iframe{width:100%;height:100%;border:1px solid var(--l);border-radius:10px;background:#0d0c0b}.stage.m iframe{width:390px}
button,select{background:var(--p2);color:var(--fg);border:1px solid var(--l);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}button:hover{border-color:var(--a)}button:disabled{opacity:.35;cursor:default}
.pri{background:var(--a);color:#16110b;border-color:var(--a);font-weight:600}.on{border-color:var(--a);color:var(--a)}
details{background:var(--p2);border:1px solid var(--l);border-radius:10px;margin-bottom:10px}summary{padding:13px 14px;cursor:pointer;font-weight:600;list-style:none}summary::after{content:"+";float:right;color:var(--a)}details[open]>summary::after{content:"–"}details>div{padding:0 14px 14px}
label{display:block;font-size:12px;color:var(--m);margin:12px 0 4px}input[type=text],textarea{width:100%;background:#12100f;border:1px solid var(--l);border-radius:8px;color:var(--fg);padding:9px 10px;font:inherit}input:focus,textarea:focus{outline:0;border-color:var(--a)}
.item{border:1px solid var(--l);border-radius:8px;padding:8px 10px;margin-top:10px;background:#1a1816}.ih{display:flex;gap:6px;align-items:center}.ih>span{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{padding:3px 9px;font-size:13px}.add{width:100%;margin-top:12px;border-style:dashed;color:var(--a)}.th{width:46px;height:46px;object-fit:cover;border-radius:6px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.pg div{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;cursor:grab;border:1px solid var(--l)}.pg img{width:100%;height:100%;object-fit:cover}
.pg i{position:absolute;left:3px;top:3px;font:11px/1 system-ui;background:#000a;padding:2px 5px;border-radius:4px;font-style:normal}.pg .x{position:absolute;right:3px;top:3px;padding:0 6px;font-size:12px;border-radius:4px;background:#000b}
.drop{margin-top:8px;border:1px dashed var(--l);border-radius:8px;padding:16px;text-align:center;color:var(--m);cursor:pointer}.drop.h{border-color:var(--a);color:var(--a)}
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9}#login[hidden]{display:none}#login div{width:min(420px,90vw)}#login h1{font:400 34px Georgia,serif;margin-bottom:8px}#login p{color:var(--m);margin-bottom:16px}
@media(max-width:900px){.main{grid-template-columns:1fr;grid-template-rows:55vh 1fr}#side{border:0;border-bottom:1px solid var(--l)}.stage.m iframe{width:100%}}
</style></head><body>
<div id="login" hidden><div><h1>Site Editor</h1><p>Paste your GitHub token to sign in. It stays only in this browser.</p><input type="text" id="tk" placeholder="github_pat_..." style="margin-bottom:12px"><button class="pri" id="go" style="width:100%">Connect</button><p id="le" style="color:#ff8a7a;margin-top:12px"></p></div></div>
<div class="top"><b>Studio Editor</b><span id="msg"></span><a href=".." target="_blank" style="color:var(--a)">View live site ↗</a><button id="out">Sign out</button><button class="pri" id="save" disabled>Save &amp; publish</button></div>
<div class="main"><div id="side"></div><div class="view"><div class="vbar"><select id="pg"></select><button id="dk" class="on">Desktop</button><button id="mb">Mobile</button></div><div class="stage" id="st"><iframe id="fr" title="Preview"></iframe></div></div></div>
<input type="file" id="fi" accept="image/*" hidden>
<script>
const REPO='jashwanthpm/jp-portfolio',BR='main',API=`https://api.github.com/repos/${REPO}/contents/`;
let tok=localStorage.getItem('jp_tok')||'',D=null,sha='',dirty=false,pend={},blobs={},opn=new Set(['b','h']),tgt=null,drag=null,tm;
const $=s=>document.querySelector(s),side=$('#side'),fi=$('#fi');
const esc=v=>String(v??'').replace(/[&"<>]/g,c=>({'&':'&amp;','"':'&quot;','<':'&lt;','>':'&gt;'}[c]));
const g=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o),st=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
const hd=()=>({Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'});
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const HOME=[['who','Who am I'],['stats','Key numbers'],['feat','Selected frames (shuffle)'],['pts','How I work'],['brands','Brands strip'],['ig','Instagram strip'],['gal','Client galleries'],['cta','Booking call-to-action']];
const NEW={stats:()=>({n:'',l:''}),points:()=>({t:'',d:''}),brands:()=>({name:''}),igItems:()=>({url:'',cover:''}),faq:()=>({q:'',a:''}),clients:()=>({name:'New gallery',slug:'gallery-'+(Date.now()%10000),date:'',story:'',cover:'',private:false,photos:[]})};
const msg=(t,e)=>{$('#msg').textContent=t||'';$('#msg').className=e?'e':''};
const touch=()=>{dirty=true;$('#save').disabled=false;msg('Unsaved changes')};
const src=v=>blobs[v]||(v&&v[0]=='/'?'..'+v:v);
/* ---------- fields ---------- */
const f=(p,l,a)=>`<label>${l}</label>`+(a?`<textarea rows="${a}" data-p="${p}">${esc(g(D,p))}</textarea>`:`<input type="text" data-p="${p}" value="${esc(g(D,p))}">`);
const imf=(p,l)=>{const v=g(D,p);return `<label>${l}</label><div class="ih">${v?`<img class="th" src="${esc(src(v))}">`:''}<button data-act="pick" data-p="${p}">${v?'Replace':'Upload'}</button>${v?`<button data-act="clr" data-p="${p}">Remove</button>`:''}</div>`};
const ctl=(l,i,n,nd)=>`<button class="ib" data-act="up" data-l="${l}" data-i="${i}" ${i?'':'disabled'}>↑</button><button class="ib" data-act="dn" data-l="${l}" data-i="${i}" ${i<n-1?'':'disabled'}>↓</button>${nd?'':`<button class="ib" data-act="del" data-l="${l}" data-i="${i}">✕</button>`}`;
const list=(l,t,row,add)=>{const a=D[l];return a.map((x,i)=>`<div class="item"><div class="ih"><span>${esc(t(x,i))}</span>${ctl(l,i,a.length)}</div>${row(i)}</div>`).join('')+`<button class="add" data-act="add" data-l="${l}">+ ${add}</button>`};
const sec=(id,t,b)=>`<details data-id="${id}" ${opn.has(id)?'open':''}><summary>${t}</summary><div>${b}</div></details>`;
const photos=i=>{const a=D.clients[i].photos;return `<label>Photos (${a.length}) · drag to reorder</label><div class="pg">${a.map((p,k)=>`<div draggable="true" data-i="${i}" data-k="${k}"><img src="${esc(src(p))}"><i>${k+1}</i><button class="x" data-act="pdel" data-i="${i}" data-k="${k}">✕</button></div>`).join('')}</div><div class="drop" data-act="padd" data-i="${i}">Drop photos here or click to add (auto-resized)</div>`};
function render(){
 const y=side.scrollTop;
 side.innerHTML=
 sec('h','Home page layout',`<p style="color:var(--m);margin:10px 0 0">Reorder or hide the sections of your home page.</p>`+D.home.map((h,i)=>`<div class="item"><div class="ih"><span>${HOME.find(x=>x[0]==h.id)[1]}</span><button class="ib" data-act="eye" data-i="${i}">${h.show?'Shown':'Hidden'}</button>${ctl('home',i,D.home.length,1)}</div></div>`).join(''))+
 sec('b','Name & intro',f('name','Your name')+f('kicker','Small line above name')+f('role','Line under name',2)+f('intro','“Who am I” heading',2)+f('about','About text',6)+imf('portrait','Your portrait'))+
 sec('n','Key numbers',list('stats',x=>`${x.n} ${x.l}`,i=>f(`stats.${i}.n`,'Number')+f(`stats.${i}.l`,'Label'),'Add number'))+
 sec('p','How I work',list('points',x=>x.t||'New point',i=>f(`points.${i}.t`,'Title')+f(`points.${i}.d`,'Description',3),'Add point'))+
 sec('r','Brands worked with',list('brands',x=>x.name||'New brand',i=>f(`brands.${i}.name`,'Name'),'Add brand'))+
 sec('i','Instagram strip',`<p style="color:var(--m);margin:10px 0 0">Paste links to your highlights, posts or reels. Their pictures slide across your home page and a click opens Instagram. If the cover can't be read automatically, upload it.</p>`+list('igItems',x=>x.url?x.url.replace(/^https?:\/\/(www\.)?instagram\.com\//,'').slice(0,30):'New item',i=>f(`igItems.${i}.url`,'Instagram link')+imf(`igItems.${i}.cover`,'Cover picture')+`<button data-act="auto" data-i="${i}" style="margin-top:10px">Find cover from link</button>`,'Add Instagram item'))+
 sec('c','Client galleries',list('clients',x=>x.name+(x.private?' (private)':''),i=>f(`clients.${i}.name`,'Gallery / client name')+f(`clients.${i}.slug`,'Link name')+f(`clients.${i}.date`,'Date')+f(`clients.${i}.story`,'Short story',3)+`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-p="clients.${i}.private" ${D.clients[i].private?'checked':''}> Private (hidden from site, link only)</label>`+imf(`clients.${i}.cover`,'Cover photo (optional)')+photos(i),'Add gallery'))+
 sec('f','FAQ (contact page)',list('faq',x=>x.q||'New question',i=>f(`faq.${i}.q`,'Question')+f(`faq.${i}.a`,'Answer',3),'Add question'))+
 sec('k','Contact & bookings',f('email','Email')+f('phone','WhatsApp (country code, no +)')+f('instagram','Instagram URL')+f('formEndpoint','Formspree URL (receives bookings)'));
 side.scrollTop=y;
}
/* ---------- preview ---------- */
function push(){clearTimeout(tm);tm=setTimeout(()=>{let s=JSON.stringify(D);for(const p in blobs)s=s.split(p).join(blobs[p]);const w=$('#fr').contentWindow;w&&w.postMessage({type:'content',data:JSON.parse(s)},location.origin)},150)}
function pages(){const c=(D.clients||[]).filter(x=>x.slug);$('#pg').innerHTML=[['index.html','Home'],['portfolio.html','Portfolio'],['clients.html','Galleries'],...c.map(x=>['gallery.html?c='+x.slug,'↳ '+x.name]),['about.html','About'],['contact.html','Contact']].map(p=>`<option value="${p[0]}">${esc(p[1])}</option>`).join('')}
const go=()=>{$('#fr').src='../'+$('#pg').value+($('#pg').value.includes('?')?'&':'?')+'preview=1'};
$('#pg').onchange=go;addEventListener('message',e=>{if(e.origin==location.origin&&e.data&&e.data.type=='ready')push()});
$('#dk').onclick=()=>{$('#st').classList.remove('m');$('#dk').className='on';$('#mb').className=''};$('#mb').onclick=()=>{$('#st').classList.add('m');$('#mb').className='on';$('#dk').className=''};
/* ---------- images ---------- */
async function prep(file){const bm=await createImageBitmap(file),mk=m=>{const s=Math.min(1,m/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*s|0;c.height=bm.height*s|0;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c};
 const p='/images/'+Date.now()+'-'+Math.random().toString(36).slice(2,6)+'.jpg';pend[p]=mk(2000).toDataURL('image/jpeg',.85).split(',')[1];blobs[p]=mk(700).toDataURL('image/jpeg',.7);return p}
async function ingest(files,t){files=[...files].filter(x=>x.type.startsWith('image/'));if(!files.length)return;msg('Preparing photos…');const ps=[];for(const x of files)ps.push(await prep(x));
 if(t.p!=null)st(D,t.p,ps[0]);else D.clients[t.i].photos.push(...ps);render();touch();push();msg(ps.length+' photo(s) added — click Save & publish')}
fi.onchange=()=>{const x=[...fi.files];fi.value='';ingest(x,tgt)};
/* ---------- events ---------- */
side.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;const v=t.type=='checkbox'?t.checked:t.value;
 if(/^clients\.\d+\.name$/.test(p)){const c=D.clients[+p.split('.')[1]];if(!c.slug||c.slug==slug(c.name)||/^gallery-\d+$/.test(c.slug)){c.slug=slug(v);const si=side.querySelector(`[data-p="clients.${p.split('.')[1]}.slug"]`);if(si)si.value=c.slug}}
 st(D,p,v);touch();push();if(p.startsWith('clients.'))clearTimeout(window.pt),window.pt=setTimeout(pages,600)});
side.addEventListener('toggle',e=>{const d=e.target.dataset&&e.target.dataset.id;if(d)e.target.open?opn.add(d):opn.delete(d)},true);
side.onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,l=b.dataset.l,p=b.dataset.p,i=+b.dataset.i,k=+b.dataset.k;
 if(a=='up'||a=='dn'){const r=D[l],j=a=='up'?i-1:i+1;[r[i],r[j]]=[r[j],r[i]]}
 else if(a=='del'){if(!confirm('Remove this item?'))return;D[l].splice(i,1)}
 else if(a=='add')D[l].push(NEW[l]());
 else if(a=='eye')D.home[i].show=!D.home[i].show;
 else if(a=='clr')st(D,p,'');
 else if(a=='pdel')D.clients[i].photos.splice(k,1);
 else if(a=='auto'){autoCover(i);return}
 else if(a=='pick'){tgt={p};fi.multiple=false;fi.click();return}
 else if(a=='padd'){tgt={i};fi.multiple=true;fi.click();return}
 render();touch();push();if(l=='clients'||a=='pdel')pages()};
side.addEventListener('dragstart',e=>{const d=e.target.closest('.pg div');if(d)drag={i:+d.dataset.i,k:+d.dataset.k}});
side.addEventListener('dragover',e=>{const z=e.target.closest('.drop,.pg div');if(z){e.preventDefault();if(z.classList.contains('drop'))z.classList.add('h')}});
side.addEventListener('dragleave',e=>{const z=e.target.closest('.drop');if(z)z.classList.remove('h')});
side.addEventListener('drop',e=>{const z=e.target.closest('.drop,.pg div');if(!z)return;e.preventDefault();z.classList.remove('h');
 if(e.dataTransfer.files.length)return ingest(e.dataTransfer.files,{i:+z.dataset.i});
 if(drag&&z.matches('.pg div')&&+z.dataset.i==drag.i){const a=D.clients[drag.i].photos,[m]=a.splice(drag.k,1);a.splice(+z.dataset.k,0,m);drag=null;render();touch();push()}});
side.addEventListener('change',e=>{const m=(e.target.dataset.p||'').match(/^igItems\.(\d+)\.url$/);if(m&&!D.igItems[+m[1]].cover)autoCover(+m[1])});
async function autoCover(i){const it=D.igItems[i];if(!it.url)return msg('Paste the Instagram link first.',1);msg('Reading the Instagram link…');
 try{const j=await (await fetch('https://api.microlink.io/?url='+encodeURIComponent(it.url))).json(),im=j.data&&j.data.image&&j.data.image.url;
  if(!im||/static\.cdninstagram|logo/i.test(im)||/log ?in/i.test(j.data.title||''))throw 0;
  it.cover=await prep(await (await fetch(im)).blob());render();touch();push();msg('Cover found ✓ — click Save & publish')}
 catch{msg("Instagram didn't share a cover for this link — please upload the cover picture.",1)}}
/* ---------- GitHub ---------- */
async function load(){const r=await fetch(API+'content.json?ref='+BR+'&t='+Date.now(),{headers:hd()});
 if(!r.ok){$('#login').hidden=false;$('#le').textContent=r.status==401?'That token was not accepted.':'Could not load content ('+r.status+'). Check the token has Contents access to '+REPO+'.';return}
 $('#login').hidden=true;const j=await r.json();sha=j.sha;D=JSON.parse(dec(j.content));
 if(!D.igItems)D.igItems=(D.igHighlights||[]).filter(h=>h.url).map(h=>({url:h.url,cover:h.cover||''}));delete D.igPosts;delete D.igHighlights;['stats','points','brands','clients','faq','igItems'].forEach(k=>D[k]=D[k]||[]);D.clients.forEach(c=>c.photos=c.photos||[]);
 const cur=(D.home||[]).filter(h=>HOME.some(x=>x[0]==h.id));HOME.forEach((x,i)=>{if(!cur.some(h=>h.id==x[0])){const pi=cur.findIndex(h=>h.id==(HOME[i-1]||[])[0]);cur.splice(pi+1,0,{id:x[0],show:true})}});D.home=cur;
 render();pages();go();msg('Loaded')}
async function save(){$('#save').disabled=true;msg('Saving…');
 try{const used=JSON.stringify(D);for(const p of Object.keys(pend)){if(!used.includes(p)){delete pend[p];continue}
  const r=await fetch(API+p.slice(1),{method:'PUT',headers:hd(),body:JSON.stringify({message:'Upload '+p.slice(8),content:pend[p],branch:BR})});if(!r.ok)throw new Error('Photo upload failed ('+r.status+')');delete pend[p]}
  const r=await fetch(API+'content.json',{method:'PUT',headers:hd(),body:JSON.stringify({message:'Update site content',content:enc(JSON.stringify(D,null,2)),sha,branch:BR})});
  if(!r.ok)throw new Error(r.status==409?'Someone changed the site meanwhile — reload this page.':'Save failed ('+r.status+')');
  sha=(await r.json()).content.sha;dirty=false;msg('Saved ✓ Live in about a minute (hard-refresh the site).')}
 catch(x){msg(x.message,1);$('#save').disabled=false}}
$('#save').onclick=save;$('#out').onclick=()=>{localStorage.removeItem('jp_tok');location.reload()};
$('#go').onclick=()=>{tok=$('#tk').value.trim();localStorage.setItem('jp_tok',tok);load()};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
tok?load():$('#login').hidden=false;
</script></body></html>
