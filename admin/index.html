<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Studio — Site Editor</title>
<style>

button,select{background:var(--p2);color:var(--fg);border:1px solid var(--l);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}button:hover{border-color:var(--a)}button:disabled{opacity:.35;cursor:default}
.pri{background:var(--a);color:#16110b;border-color:var(--a);font-weight:600}.on{border-color:var(--a);color:var(--a)}
details{background:var(--p2);border:1px solid var(--l);border-radius:10px;margin-bottom:10px}summary{padding:13px 14px;cursor:pointer;font-weight:600;list-style:none}summary::after{content:"+";float:right;color:var(--a)}details[open]>summary::after{content:"–"}details>div{padding:0 14px 14px}
label{display:block;font-size:12px;color:var(--m);margin:12px 0 4px}input[type=text],textarea{width:100%;background:#12100f;border:1px solid var(--l);border-radius:8px;color:var(--fg);padding:9px 10px;font:inherit}input:focus,textarea:focus{outline:0;border-color:var(--a)}#side select{width:100%}

.ph3{font:400 24px Georgia,serif;margin:14px 0 4px}

.ib.on{background:var(--a);color:#16110b;border-color:var(--a)}
.gt{width:54px;height:54px;border-radius:8px;overflow:hidden;background:#12100f;flex:none}.gt img{width:100%;height:100%;object-fit:cover}.gi{flex:1;min-width:0}.gi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gi small{color:var(--m)}

.pi.sel{border-color:var(--a)}.pi.sel .ck{background:var(--a);color:#16110b;border-color:var(--a)}.pi.cv::after{content:"★ cover";position:absolute;left:6px;bottom:6px;background:var(--a);color:#16110b;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600}
.pi.ov{box-shadow:-6px 0 0 var(--a)}.pi.end{border:1px dashed var(--l);display:grid;place-items:center;color:var(--m);font-size:12px;text-align:center;padding:8px;cursor:default}
/* progress */
#prog{position:fixed;inset:0;z-index:60;background:#000a;display:grid;place-items:center}.pbox{width:min(440px,90vw);background:var(--p);border:1px solid var(--l);border-radius:14px;padding:22px}.pbox b{font:400 24px Georgia,serif}
.bar{height:10px;background:#12100f;border-radius:6px;overflow:hidden;margin:16px 0 8px}.bar i{display:block;height:100%;width:0;background:var(--a);transition:width .25s}.bar.ind i{width:40%!important;animation:ind 1.1s ease-in-out infinite alternate}@keyframes ind{to{margin-left:60%}}
.pr{display:flex;justify-content:space-between;gap:10px;color:var(--m);font-size:13px;align-items:center}.pr .err{color:#ff8a7a}
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:70}#login div{width:min(420px,90vw)}#login h1{font:400 34px Georgia,serif;margin-bottom:8px}#login p{color:var(--m);margin-bottom:16px}
@media(max-width:900px){.main{grid-template-columns:1fr;grid-template-rows:50vh 1fr}#side{border:0;border-bottom:1px solid var(--l)}.stage.m iframe{width:100%}}
</style></head><body>
<div id="login" hidden><div><h1>Site Editor</h1><p>Paste your GitHub token to sign in. It stays only in this browser.</p><input type="text" id="tk" placeholder="github_pat_..." style="margin-bottom:12px"><button class="pri" id="go" style="width:100%">Connect</button><p id="le" style="color:#ff8a7a;margin-top:12px"></p></div></div>
<div class="top"><b>Studio Editor</b><span id="msg"></span><a href=".." target="_blank" style="color:var(--a)">View live site ↗</a><button id="out">Sign out</button><button class="pri" id="save" disabled>Save &amp; publish</button></div>
<div class="main"><div id="side"></div><div class="view"><div class="vbar"><select id="pg"></select><button id="dk" class="on">Desktop</button><button id="mb">Mobile</button></div><div class="stage" id="st"><iframe id="fr" title="Preview"></iframe></div></div></div>
<div id="pm" hidden><div class="pmh"><b id="pmt"></b><small id="pmn"></small><button data-pm="add">+ Add pictures</button><button data-pm="all">Select all</button><button data-pm="clear">Clear</button><button data-pm="earlier">◀ Earlier</button><button data-pm="later">Later ▶</button><button data-pm="first">⇤ To start</button><button data-pm="last">⇥ To end</button><button data-pm="cover">★ Set as cover</button><button data-pm="del">Delete</button><button class="pri" data-pm="done">Done</button></div><div class="pmg" id="pmg"></div></div>
<div id="prog" hidden><div class="pbox"><b id="pt"></b><div class="bar" id="bar"><i id="pb"></i></div><div class="pr"><span id="ps"></span><span id="pc"></span></div><div class="pr" style="margin-top:6px"><small id="pe"></small><button id="pcl" hidden>Close</button></div></div></div>
<input type="file" id="fi" accept="image/*" hidden>
<script>
const REPO='jashwanthpm/jp-portfolio',BR='main',API=`https://api.github.com/repos/${REPO}/contents/`,GIT=`https://api.github.com/repos/${REPO}/git/`;
let tok=localStorage.getItem('jp_tok')||'',D=null,dirty=false,pend={},blobs={},tgt=null,tm,tab='home',gi=-1,open1={home:'hr',about:'a1',contact:'k',site:'d'},PM=null,fdrag=null,pscroll=null;
const $=s=>document.querySelector(s),side=$('#side'),fi=$('#fi'),sleep=t=>new Promise(r=>setTimeout(r,t));

const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
const hd=()=>({Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'});

const HOME=[['who','Who am I'],['stats','Key numbers'],['feat','Selected frames (shuffle)'],['pts','How I work'],['brands','Brands strip'],['ig','Instagram strip'],['gal','Client galleries'],['cta','Booking call-to-action']];
const NEW={stats:()=>({n:'',l:''}),points:()=>({t:'',d:''}),igItems:()=>({url:'',covers:[]}),services:()=>({t:'',d:'',img:''}),faq:()=>({q:'',a:''}),clients:()=>({name:'New gallery',slug:'gallery-'+(Date.now()%10000),date:'',story:'',cover:'',private:false,photos:[]})};
const DFLT={story:"I didn't pick up a camera to make perfect pictures. I picked it up to keep real moments from slipping away.\n\nOn a wedding day I stay close but quiet, watching for the glances, the nervous laughs, the blessings of elders and the tears nobody planned. Those are the frames families return to years later.\n\nMy style is natural, candid and unhurried. I work with the light and the moment as they are, and I edit honestly, so your gallery feels like your day, nothing more and nothing less.",services:[{t:"Weddings",d:"Full-day coverage of rituals, family and the small in-between moments."},{t:"Pre-wedding & engagement",d:"Relaxed, story-led shoots in places that mean something to you."},{t:"Haldi, Mehendi & Sangeet",d:"Colour, music and energy, captured as it happens."},{t:"Portraits",d:"Honest portraits for brides, grooms, families and brands."}]};
const FONTS=['Cormorant Garamond','Playfair Display','Cinzel','DM Serif Display','Fraunces','Libre Baskerville','Inter','Poppins','Montserrat','Jost','DM Sans'];
const TABS=[['home','Home'],['pf','Portfolio'],['gal','Galleries'],['about','About'],['contact','Contact'],['site','Site']];
const TABPG={home:'index.html',pf:'portfolio.html',gal:'clients.html',about:'about.html',contact:'contact.html'};
const SECTAB={hr:['home','hr'],b:['home','b'],h:['home','h'],n:['home','n'],p:['home','p'],r:['home','r'],i:['home','i'],lg:['site','lg'],pf:['pf',''],c:['gal',''],a:['about','a1']};
const SECSEL={hr:'.hero',b:'.hero',h:'.hero',n:'#stats',p:'#pts',r:'#mq',i:'#igsec',lg:'.logo'};
const msg=(t,e)=>{$('#msg').textContent=t||'';$('#msg').className=e?'e':''};
const touch=()=>{dirty=true;$('#save').disabled=false;msg('Unsaved changes')};
const src=v=>blobs[v]||(v&&v[0]=='/'?'..'+v:v);
const tsrc=v=>blobs[v]||(v&&v.startsWith('/images/')&&!v.startsWith('/images/t/')?'..'+v.replace('/images/','/images/t/'):src(v));
const timg=v=>`<img src="${esc(tsrc(v))}" loading="lazy" onerror="this.onerror=null;this.src='${esc(src(v))}'">`;
/* ---------- progress window ---------- */
const P={t0:0,iv:null};
function pOpen(t){$('#prog').hidden=false;$('#pt').textContent=t;$('#bar').className='bar';$('#ps').className='';$('#pcl').hidden=true;pSet(0,'Starting…');P.t0=Date.now();clearInterval(P.iv);P.iv=setInterval(()=>{$('#pe').textContent='Time: '+Math.round((Date.now()-P.t0)/1000)+'s'},300)}
function pSet(f,t){$('#pb').style.width=Math.round(f*100)+'%';$('#pc').textContent=Math.round(f*100)+'%';if(t!=null)$('#ps').textContent=t}
function pClose(d){clearInterval(P.iv);setTimeout(()=>$('#prog').hidden=true,d||0)}

$('#pcl').onclick=()=>pClose();
/* ---------- field builders ---------- */
const f=(p,l,a)=>`<label>${l}</label>`+(a?`<textarea rows="${a}" data-p="${p}">${esc(g(D,p))}</textarea>`:`<input type="text" data-p="${p}" value="${esc(g(D,p))}">`);
const imf=(p,l)=>{const v=g(D,p);return `<label>${l}</label><div class="ih">${v?`<img class="th" src="${esc(tsrc(v))}">`:''}<button data-act="pick" data-p="${p}">${v?'Replace':'Upload'}</button>${v?`<button data-act="clr" data-p="${p}">Remove</button>`:''}</div>`};
const sel=(p,l,o)=>`<label>${l}</label><select data-p="${p}"><option value="">Default</option>${o.map(x=>`<option ${g(D,p)==x?'selected':''}>${x}</option>`).join('')}</select>`;
const rng=(p,l,a,b,d)=>`<label>${l}: <b data-v="${p}">${g(D,p)||d}%</b></label><input type="range" data-p="${p}" data-n="1" min="${a}" max="${b}" value="${g(D,p)||d}" style="width:100%">`;
const col=(p,l,d)=>`<label>${l}</label><input type="color" data-p="${p}" value="${g(D,p)||d}" style="width:60px;height:36px;padding:0;border:0;background:none">`;
const chk=(p,l)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--fg);font-size:14px;margin:8px 0"><input type="checkbox" data-p="${p}" ${g(D,p)===false?'':'checked'}> ${l}</label>`;
const HIDE=['stats','points','services','faq','igItems','clients'];
const ctl=(l,i,n,nd,hv)=>`<button class="ib" data-act="up" data-l="${l}" data-i="${i}" ${i?'':'disabled'}>↑</button><button class="ib" data-act="dn" data-l="${l}" data-i="${i}" ${i<n-1?'':'disabled'}>↓</button>${hv===undefined?'':`<button class="ib" data-act="hide" data-l="${l}" data-i="${i}" title="${hv?'Hidden — click to show':'Shown — click to hide'}">${hv?'🚫':'👁'}</button>`}${nd?'':`<button class="ib" data-act="del" data-l="${l}" data-i="${i}" title="Remove">✕</button>`}`;
const list=(l,t,row,add)=>{const a=D[l];return a.map((x,i)=>{const hv=HIDE.includes(l)?!!(l=='clients'?x.private:x.hide):undefined;return `<div class="item" ${hv?'style="opacity:.5"':''}><div class="ih"><span>${esc(t(x,i))}</span>${ctl(l,i,a.length,0,hv)}</div>${row(i)}</div>`}).join('')+`<button class="add" data-act="add" data-l="${l}">+ ${add}</button>`};
const sec=(id,t,b)=>`<details data-id="${id}" ${open1[tab]==id?'open':''}><summary>${t}</summary><div>${b}</div></details>`;
const arr=(g,i)=>g=='hp'?D.heroPics:g=='ig'?D.igItems[i].covers:g=='pf'?D.portfolio:g=='ap'?D.aboutPics:D.clients[i].photos;
const LBL={ig:'Pictures (add every slide, in order)',pf:'Portfolio pictures',ap:'Pictures',c:'Pictures',hp:'Pictures'};
const pgrid=(i,g='c',lbl)=>{const a=arr(g,i),at=`data-g="${g}" data-i="${i}"`,n=a.length;return `<label>${lbl||LBL[g]} (${n})</label><div class="dz" ${at}><div class="pg">${a.slice(0,11).map((p,k)=>`<div ${at} data-act="pm" title="Click to arrange">${timg(p)}<i>${k+1}</i></div>`).join('')}${n>11?`<div ${at} data-act="pm" class="more">+${n-11}<br>more</div>`:''}${n?'':`<div class="empty">No pictures yet. Drop them here or use Add.</div>`}</div></div><div class="ih" style="margin-top:8px;flex-wrap:wrap"><button class="pri" ${at} data-act="pm">Arrange &amp; manage</button><button ${at} data-act="padd">+ Add pictures</button></div>`};
const fz=v=>{if(!v)return '';const [x,y]=((D.focus||{})[v]||'50% 50%').split(' '),u=esc(src(v));return `<label>Focus point: click or drag on the picture where it should stay centred (also on phones)</label><div class="fw" data-fv="${esc(v)}"><div class="fz"><img src="${u}" draggable="false"><i style="left:${x};top:${y}"></i></div><div class="fm"><span>Desktop</span><div class="m1"><img src="${u}" style="object-position:${x} ${y}"></div><span>Phone</span><div class="m2"><img src="${u}" style="object-position:${x} ${y}"></div></div></div>`};
const heroEd=()=>D.heroPics.map((p,k)=>`<div class="item"><div class="ih"><span>Slide ${k+1}</span><button class="ib" data-act="pl" data-g="hp" data-i="0" data-k="${k}">◀</button><button class="ib" data-act="pr" data-g="hp" data-i="0" data-k="${k}">▶</button><button class="ib" data-act="pdel" data-g="hp" data-i="0" data-k="${k}" title="Remove">✕</button></div>${fz(p)}</div>`).join('')+`<div class="dz" data-g="hp" data-i="0"><button class="add" data-act="padd" data-g="hp" data-i="0">+ Add hero pictures (or drop them here)</button></div>`;
/* ---------- pictures: counting, optimizing ---------- */
function allPaths(){const s=new Set(),add=p=>p&&typeof p=='string'&&p.startsWith('/images/')&&!p.startsWith('/images/t/')&&!/favicon-/.test(p)&&s.add(p);
 [D.portfolio,D.heroPics,D.aboutPics].forEach(a=>(a||[]).forEach(add));add(D.portrait);add(D.logoImg);D.clients.forEach(c=>{add(c.cover);c.photos.forEach(add)});D.igItems.forEach(x=>x.covers.forEach(add));D.services.forEach(x=>add(x.img));return s}
const needs=()=>[...allPaths()].filter(p=>!D.dims[p]).length;
const mkc=(bm,m)=>{const s=Math.min(1,m/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.max(1,bm.width*s|0);c.height=Math.max(1,bm.height*s|0);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c};
async function prep(file){const bm=await createImageBitmap(file),name=Date.now()+'-'+Math.random().toString(36).slice(2,6)+'.jpg',p='/images/'+name,big=mkc(bm,2000);
 pend[p]={b:big.toDataURL('image/jpeg',.85).split(',')[1]};pend['/images/t/'+name]={b:mkc(bm,900).toDataURL('image/jpeg',.8).split(',')[1],u:p};blobs[p]=mkc(bm,700).toDataURL('image/jpeg',.7);D.dims[p]=[big.width,big.height];bm.close&&bm.close();return p}
async function prepIcon(file){const bm=await createImageBitmap(file),s=Math.min(bm.width,bm.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(bm,(bm.width-s)/2,(bm.height-s)/2,s,s,0,0,256,256);const u=c.toDataURL('image/png'),p='/images/favicon-'+Date.now()+'.png';pend[p]={b:u.split(',')[1]};blobs[p]=u;return p}
async function ingest(files,t){files=[...files].filter(x=>x.type.startsWith('image/'));if(!files.length)return;pOpen('Preparing pictures');const ps=[];
 try{for(let n=0;n<files.length;n++){pSet(n/files.length,`Picture ${n+1} of ${files.length}…`);ps.push(await (t.icon?prepIcon(files[n]):prep(files[n])))}}catch(e){pFail('One picture could not be read: '+e.message);return}
 if(t.p!=null)st(D,t.p,ps[0]);else arr(t.g,t.i).push(...ps);pSet(1,'Done');pClose(350);render();touch();push();if(PM)pmDraw();msg(ps.length+' picture(s) added. Click Save & publish when ready.')}
fi.onchange=()=>{const x=[...fi.files];fi.value='';ingest(x,tgt)};
async function optimize(){const ps=[...allPaths()].filter(p=>!D.dims[p]);if(!ps.length)return;pOpen('Optimizing pictures');let n=0,fail=0;
 for(const p of ps){n++;pSet(n/ps.length*.85,`Picture ${n} of ${ps.length}…`);
