<meta name="author" content="Jashwanth JP"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/site.css?v=20261103-layouts"><link rel="icon" type="image/png" sizes="256x256" href="/images/favicon-1791284648615.png"><link rel="apple-touch-icon" href="/images/favicon-1791284648615.png"></head><body data-p="enquire"><section class="pg"><div class="wrap"><span class="eb">Enquiry form</span><h1>Tell me about <em>your shoot</em></h1><p class="lead" style="margin-top:26px">A few quick details and I'll send you a quotation personally.</p></div></section>
<section class="sec" style="padding-top:60px"><div class="wrap enq rv">
<form id="ef" class="fc">
<h4>The shoot</h4>
<label class="q">What do you need?</label><div class="chips" id="et"><button type="button" class="on">Wedding</button><button type="button">Pre-wedding</button><button type="button">Engagement</button><button type="button">Haldi / Mehendi / Sangeet</button><button type="button">Collab / brand shoot</button><button type="button">Portraits</button><button type="button">Other</button></div><input type="hidden" name="type" value="Wedding">
<label class="q">What would you like included? (pick any)</label><div class="chips" id="es"><button type="button">Candid photography</button><button type="button">Traditional photography</button><button type="button">Album</button><button type="button">Reels / teaser</button><button type="button">Not sure yet</button></div><input type="hidden" name="wants" value="">
<div class="row2"><input name="date" type="date" aria-label="Event date"><input name="days" placeholder="Number of days / events"></div>
<input name="venue" placeholder="Venue / city">
<h4>About you</h4>
<div class="row2"><input name="name" placeholder="Your name" required><input name="phone" placeholder="Phone / WhatsApp" required></div>
<div class="row2"><input name="email" type="email" placeholder="Email" required><input name="instagram" placeholder="Instagram handle (optional)"></div>
<input name="company" placeholder="Brand / company (for collab shoots)">
<h4>Budget &amp; notes</h4>
<select name="budget" aria-label="Budget"><option value="">Approximate budget (optional)</option><option>Under ₹25,000</option><option>₹25,000 – ₹50,000</option><option>₹50,000 – ₹1,00,000</option><option>₹1,00,000+</option><option>Not sure, send me a quote</option></select>
<select name="found" aria-label="How did you find me"><option value="">How did you find me? (optional)</option><option>Instagram</option><option>Friend / referral</option><option>Google</option><option>Saw your work at an event</option><option>Other</option></select>
<textarea name="message" rows="4" placeholder="Anything else I should know?"></textarea>
<input class="hp" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="btn f" style="justify-self:start;margin-top:22px">Send enquiry →</button>
<div id="eo" aria-live="polite"></div>
<p class="tiny">Your details are only used to reply to your enquiry.</p>
</form>
<div class="fc okbox" id="ok2"><h3 id="okn">Thank you</h3><p>I've received your details and will send your quotation shortly.</p><a class="btn" id="okw" target="_blank" rel="noopener" hidden>Message me on WhatsApp</a></div>
</div></section><div style="height:100px"></div><script src="assets/site.js?v=20261103-layouts"></script></body></html>
